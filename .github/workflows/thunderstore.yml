name: thunderstore

# Publishes the Thunderstore package of a GitHub Release (CarriageTracker-<version>.zip, built by release.yml)
# to thunderstore.io, V Rising community. Runs by itself after release.yml has made a new release, or by hand
# (Actions -> thunderstore -> Run workflow) for a release that already exists, for example the first upload.
#
# Needs, in the repository settings (Settings -> Secrets and variables -> Actions):
# - secret THUNDERSTORE_KEY: the API token of a service account of the Thunderstore team
#   (thunderstore.io -> Teams -> the team -> Service Accounts). Never written anywhere else.
# - variable THUNDERSTORE_TEAM: the team's name, the package's namespace on Thunderstore.
# Without either the job only says so and succeeds, so releases on GitHub work as before.
#
# Thunderstore refuses a version it already has; publishing the same version twice fails at the upload and
# changes nothing.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version of an existing GitHub Release, without the v (e.g. 1.0.19)
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check settings
        id: cfg
        env:
          KEY: ${{ secrets.THUNDERSTORE_KEY }}
          TEAM: ${{ vars.THUNDERSTORE_TEAM }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$KEY" ] || [ -z "$TEAM" ]; then
            echo "::notice::THUNDERSTORE_KEY secret or THUNDERSTORE_TEAM variable not set, not publishing to Thunderstore."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not X.Y.Z."
            exit 1
          fi
          if ! printf '%s' "$TEAM" | grep -Eq '^[A-Za-z0-9_]+$'; then
            echo "::error::THUNDERSTORE_TEAM '$TEAM' may contain only letters, digits and _."
            exit 1
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Package of the release
        if: steps.cfg.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p ts
          gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -p "CarriageTracker-$VERSION.zip" -D ts
          unzip -p "ts/CarriageTracker-$VERSION.zip" manifest.json > ts/manifest.json
          grep -q "\"version_number\": \"$VERSION\"" ts/manifest.json || { echo "::error::manifest.json of the zip is not version $VERSION"; cat ts/manifest.json; exit 1; }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        if: steps.cfg.outputs.go == 'true'
        with:
          dotnet-version: 8.0.x
      - name: Publish
        if: steps.cfg.outputs.go == 'true'
        env:
          THUNDERSTORE_KEY: ${{ secrets.THUNDERSTORE_KEY }}
          TEAM: ${{ vars.THUNDERSTORE_TEAM }}
          VERSION: ${{ inputs.version }}
        run: |
          dotnet tool install --global tcli --version 0.2.4
          cd ts
          # tcli takes the team, community and categories from thunderstore.toml; name, version, description and
          # dependencies come from manifest.json inside the zip. The categories are those Bloodcraft uses.
          cat > thunderstore.toml <<EOF
          [config]
          schemaVersion = "0.0.1"

          [package]
          namespace = "$TEAM"
          name = "CarriageTracker"
          versionNumber = "$VERSION"
          description = "Carriages on the map, announcements and automatic carriage starts."
          websiteUrl = "https://github.com/$GITHUB_REPOSITORY"
          containsNsfwContent = false

          [build]
          outdir = "."

          [publish]
          repository = "https://thunderstore.io"
          communities = ["v-rising"]

          [publish.categories]
          v-rising = ["mods", "server", "oakveil-update"]
          EOF
          tcli publish --token "$THUNDERSTORE_KEY" --file "CarriageTracker-$VERSION.zip"
          echo "::notice::Published $TEAM-CarriageTracker $VERSION: https://thunderstore.io/c/v-rising/p/$TEAM/CarriageTracker/"
