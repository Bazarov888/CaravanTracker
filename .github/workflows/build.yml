name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Tests of the decision logic
        run: dotnet run --project tests -c Release
      - name: Build
        run: dotnet build -c Release
      - name: Thunderstore package
        uses: actions/upload-artifact@v6
        with:
          name: CaravanTracker
          path: dist/*.zip
