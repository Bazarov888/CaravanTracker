name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Tests of the decision logic
        run: dotnet run --project tests -c Release
      - name: Build
        run: dotnet build -c Release
      # For trying a pull request on a server. Releases (with the DLL for download) come from release.yml.
      - name: DLL and Thunderstore package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: CarriageTracker
          path: |
            bin/Release/net6.0/CarriageTracker.dll
            dist/*.zip
