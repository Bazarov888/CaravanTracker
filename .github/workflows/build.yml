name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Build
        run: dotnet build -c Release
      - name: Thunderstore package
        uses: actions/upload-artifact@v4
        with:
          name: CaravanTracker
          path: dist/*.zip
